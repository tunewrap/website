    <path d="M105 405 C280 130 420 545 605 300 S910 125 1090 330" stroke="url(#gold)" stroke-width="6"/>
    <path d="M130 465 C330 250 440 565 635 355 S920 205 1065 385" stroke="#f0c96f" stroke-opacity=".14" stroke-width="28" filter="url(#blur)"/>
    <path d="M130 465 C330 250 440 565 635 355 S920 205 1065 385" stroke="url(#gold)" stroke-opacity=".75" stroke-width="3"/>
    <path d="M195 235 C390 440 505 90 705 315 S940 505 1040 250" stroke="#f2d084" stroke-opacity=".12" stroke-width="25" filter="url(#blur)"/>
    <path d="M195 235 C390 440 505 90 705 315 S940 505 1040 250" stroke="url(#gold)" stroke-opacity=".55" stroke-width="2"/>
  </g>
  <g transform="translate(600 330)" fill="#e7b75b">
