<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">TuneWrap Wedding Package</title>
  <desc id="desc">Abstract premium golden sound ribbons on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171318"/>
      <stop offset=".55" stop-color="#0b0a0c"/>
      <stop offset="1" stop-color="#15100c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d5d1d"/>
      <stop offset=".38" stop-color="#f3ca72"/>
      <stop offset=".7" stop-color="#d79b35"/>
      <stop offset="1" stop-color="#fff0bd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="48%">
      <stop offset="0" stop-color="#e5ad47" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e5ad47" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
