    <rect x="44" y="-42" width="10" height="114" rx="5"/>
    <rect x="70" y="-15" width="10" height="60" rx="5" opacity=".72"/>
    <rect x="96" y="-2" width="10" height="34" rx="5" opacity=".55"/>
